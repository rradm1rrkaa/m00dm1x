<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Подберите место для отдыха в Астане и окрестностях по настроению.">
  <title>MoodMix — каталог и подборка</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/atmosphere.css">
  <link rel="stylesheet" href="css/showcase.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/messenger.css">
  <link rel="stylesheet" href="css/place.css">
  <script type="module" src="js/main.js"></script>
</head>
<body class="app-page">
  <div class="app-atmosphere scene-art" aria-hidden="true"></div>
  <a class="skip" id="skip-link" href="#out" hidden>Перейти к каталогу</a>
  <div id="app" data-view="loading">
    <header class="app-header">
      <div class="head-inner">
        <a class="brand brand-script" href="index.html">MoodMix</a>
        <nav class="head-primary" aria-label="Навигация">
          <button id="nav-catalog" type="button" class="nav-link" aria-current="page">Каталог</button>
          <button id="nav-quiz" type="button" class="nav-link">Подборка</button>
          <button id="friends" type="button" class="nav-link" hidden>Друзья <span class="bd" id="friend-badge" hidden></span></button>
          <button id="chats" type="button" class="nav-link" aria-label="Direct · Сообщения" hidden>Direct <span class="bd" id="chat-badge" hidden></span></button>
        </nav>
        <div class="head-utilities"><div id="theme-slot"></div><button id="profile" type="button" class="tbtn">Профиль</button></div>
      </div>
    </header>
    <div id="app-loading" class="content-width" role="status">
      <p id="startup-note">Загружаем MoodMix…</p>
      <noscript><p>Включите JavaScript для просмотра каталога.</p></noscript>
    </div>
    <section id="quiz" class="gate content-width" aria-label="Тест по настроению" hidden></section>
    <section id="workspace" class="content-width" hidden></section>
    <section id="catalog" class="content-width" aria-label="Каталог MoodMix" hidden>
      <div class="bar" id="catalog-toolbar">
        <section class="app-intro">
          <div class="intro-copy">
            <p class="destination">Астана и окрестности</p>
            <h1>Куда сходить?</h1>
            <p class="intro-lead">Найдите место под настроение и планы на день.</p>
            <div class="intro-actions">
              <button id="start-quiz" class="btn c" type="button">Подобрать место</button>
              <button id="profiles" class="btn quiet" type="button">Демо-профили</button>
            </div>
            <p id="mode-note" class="m">Места и идеи для отдыха</p>
          </div>
          <figure class="intro-photo">
            <img src="assets/images/bayterek-night.jpg" width="960" height="960" alt="Байтерек в вечерней подсветке">
            <figcaption><span>Байтерек, Астана</span><a href="https://commons.wikimedia.org/wiki/File:Baiterek_monument_at_night.jpg" target="_blank" rel="noopener noreferrer">Dauren Nabijan · CC0</a></figcaption>
          </figure>
        </section>
        <p id="storage-note" class="m" role="status" hidden></p>
        <div class="discovery-controls">
          <div class="catalog-search">
            <label class="visually-hidden" for="q">Поиск по местам</label>
            <span data-icon="search"></span><input type="search" id="q" placeholder="Парк или кафе" autocomplete="off">
          </div>
          <details class="catalog-filters" id="filters">
            <summary>Фильтры</summary>
            <div id="filter-controls" class="filter-controls"></div>
          </details>
          <div id="tabs" class="tabs" aria-label="Раздел каталога"></div>
        </div>
      </div>
      <main id="out" tabindex="-1"></main>
    </section>
    <footer class="app-footer"><div class="app-footer-inner"><a class="brand brand-script" href="index.html">MoodMix</a><span>Часы работы и цены уточняйте перед поездкой.</span></div></footer>
  </div>
  <dialog id="pf" aria-labelledby="dialog-title">
    <div class="pc" id="pfc"></div>
    <div class="dialog-toast" data-dialog-status role="status" aria-live="polite" aria-atomic="true"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
