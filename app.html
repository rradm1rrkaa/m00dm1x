<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Подберите место для отдыха в Астане и окрестностях по настроению.">
  <title>MoodMix — каталог и подборка</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sky.css">
  <link rel="stylesheet" href="css/showcase.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/messenger.css">
  <script type="module" src="js/main.js"></script>
</head>
<body class="app-page">
  <div id="sky" aria-hidden="true">
    <div id="stars"></div><div id="sun"></div><div id="moon"></div><div id="clouds"></div>
    <svg id="hill" viewBox="0 0 100 34" preserveAspectRatio="none"><path id="hf" d="M0 14Q14 5 30 10T58 6T82 11T100 14V34H0Z"/><path id="hp" d="M0 18Q12 11 26 16T52 14T76 17T100 18V34H0Z"/></svg>
  </div>
  <a class="skip" id="skip-link" href="#out">Перейти к каталогу</a>
  <div id="app" data-view="catalog">
    <header class="app-header content-width surface-panel">
      <a class="brand" href="index.html"><span data-icon="compass"></span>MoodMix</a>
      <nav class="head-primary" aria-label="Навигация">
        <button id="nav-catalog" type="button" class="nav-link" aria-current="page"><span data-icon="compass"></span>Каталог</button>
        <button id="nav-quiz" type="button" class="nav-link"><span data-icon="spark"></span>Подборка</button>
        <button id="friends" type="button" class="nav-link" hidden><span data-icon="users"></span>Друзья <span class="bd" id="friend-badge" hidden></span></button>
        <button id="chats" type="button" class="nav-link" hidden><span data-icon="chat"></span>Сообщения <span class="bd" id="chat-badge" hidden></span></button>
      </nav>
      <div class="head-utilities"><span id="theme-slot"></span><button id="profile" type="button" class="tbtn">Профиль</button></div>
    </header>
    <section id="quiz" class="gate content-width" aria-label="Тест по настроению" hidden></section>
    <section id="workspace" class="content-width" hidden></section>
    <section id="catalog" class="content-width" aria-label="Каталог MoodMix">
      <div class="bar" id="catalog-toolbar">
        <section class="app-intro surface-panel">
          <div class="intro-copy">
            <p class="destination"><span data-icon="pin"></span>Астана и окрестности</p>
            <h1>Куда сходить?</h1>
            <p class="intro-lead">Найдите место под настроение и планы на день.</p>
            <div class="intro-actions">
              <button id="start-quiz" class="btn c" type="button">Подобрать место<span data-icon="arrow"></span></button>
              <button id="profiles" class="btn" type="button">Демо-профили</button>
            </div>
            <p id="mode-note" class="m">Места и идеи для отдыха</p>
          </div>
          <figure class="intro-photo">
            <img src="assets/images/bayterek-night.jpg" width="960" height="960" alt="Байтерек в вечерней подсветке">
            <figcaption><span>Байтерек, Астана</span><a href="https://commons.wikimedia.org/wiki/File:Baiterek_monument_at_night.jpg" target="_blank" rel="noopener noreferrer">Dauren Nabijan · CC0</a></figcaption>
          </figure>
        </section>
        <p id="storage-note" class="m" role="status" hidden></p>
        <div class="discovery-controls">
          <div class="catalog-search">
            <label class="visually-hidden" for="q">Поиск по местам</label>
            <span data-icon="search"></span><input type="search" id="q" placeholder="Парк или кафе" autocomplete="off">
          </div>
          <details class="catalog-filters" id="filters">
            <summary><span data-icon="sliders"></span>Фильтры</summary>
            <div id="filter-controls" class="filter-controls"></div>
          </details>
          <div id="tabs" class="tabs" aria-label="Раздел каталога"></div>
        </div>
      </div>
      <main id="out" tabindex="-1"><p class="m" id="startup-note">Загружаем каталог…</p></main>
      <noscript><p>Включите JavaScript для просмотра каталога.</p></noscript>
    </section>
    <footer class="app-footer content-width">MoodMix <span>Часы работы и цены уточняйте перед поездкой.</span></footer>
  </div>
  <dialog id="pf" aria-labelledby="dialog-title">
    <div class="pc" id="pfc"></div>
    <div class="dialog-toast" data-dialog-status role="status" aria-live="polite" aria-atomic="true"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
