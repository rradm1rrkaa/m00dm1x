<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Подберите место для отдыха в Астане и окрестностях по настроению.">
  <title>MoodMix — каталог и подборка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/sky.css">
  <link rel="stylesheet" href="css/showcase.css">
  <script type="module" src="js/main.js"></script>
</head>
<body class="app-page">
  <div id="sky" aria-hidden="true">
    <div id="stars"></div><div id="sun"></div><div id="moon"></div><div id="clouds"></div>
    <svg id="hill" viewBox="0 0 100 34" preserveAspectRatio="none"><path id="hf" d="M0 14Q14 5 30 10T58 6T82 11T100 14V34H0Z"/><path id="hp" d="M0 18Q12 11 26 16T52 14T76 17T100 18V34H0Z"/></svg>
  </div>
  <a class="skip" id="skip-link" href="#out">Перейти к каталогу</a>
  <div id="app">
    <header class="app-header">
      <a class="brand" href="index.html">MoodMix</a>
      <nav class="hr" aria-label="Профиль и оформление">
        <button id="find-friends" type="button" class="tbtn" hidden>🔍 Найти друзей</button>
        <button id="friends" type="button" class="tbtn" hidden>❤️ Друзья <span class="bd" id="friend-badge" hidden></span></button>
        <button id="chats" type="button" class="tbtn" hidden>💬 Чаты <span class="bd" id="chat-badge" hidden></span></button>
        <span id="theme-slot"></span>
        <button id="profile" type="button" class="tbtn">Профиль</button>
      </nav>
    </header>
    <section id="quiz" class="gate" aria-label="Тест по настроению" hidden></section>
    <section id="catalog" aria-label="Каталог MoodMix">
      <div class="bar" id="catalog-toolbar">
        <div class="app-intro">
          <div><h1>Куда сходить?</h1><p id="mode-note" class="m">Каталог мест и идей для отдыха</p></div>
          <div class="intro-actions">
            <button id="start-quiz" class="btn c" type="button">Подобрать место</button>
            <button id="profiles" class="btn" type="button">Демо-профили</button>
          </div>
        </div>
        <p id="storage-note" class="m" role="status" hidden></p>
        <label class="lbl" for="q">Поиск по местам</label>
        <input type="search" id="q" placeholder="Например, парк или кофе" autocomplete="off">
        <div id="tabs" class="tabs" aria-label="Раздел каталога"></div>
        <details class="catalog-filters" id="filters">
          <summary>Фильтры</summary>
          <div id="filter-controls"></div>
        </details>
      </div>
      <main id="out" tabindex="-1"><p class="m" id="startup-note">Загружаем каталог…</p></main>
      <noscript><p>Для каталога нужен JavaScript. Вы можете вернуться на <a href="index.html">главную страницу</a>.</p></noscript>
    </section>
    <footer>Астана и окрестности. Уточняйте часы и цены перед поездкой.</footer>
  </div>
  <dialog id="pf" aria-labelledby="dialog-title">
    <div class="pc" id="pfc"></div>
    <div class="dialog-toast" data-dialog-status role="status" aria-live="polite" aria-atomic="true"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
