<script>try{document.documentElement.dataset.theme=localStorage.getItem("moonmix_theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><style>/* MoonMix — «Восход» (light) и «Закат» (dark) */
:root{--t:#10233a;--m:#3d5470;--a:#c2410c;--ag:linear-gradient(135deg,#ff9a3c,#ff5d7a);--c:rgba(255,255,255,.28);--b:rgba(255,255,255,.55);--bg:#cfe6fb;--pn:rgba(255,255,255,.2);--ts:rgba(255,255,255,.55);--sh:0 10px 34px rgba(30,70,120,.16);--ease:cubic-bezier(.22,.8,.24,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--t:#f6f0fd;--m:#cdc1e3;--a:#ffb27a;--c:rgba(26,16,54,.3);--b:rgba(255,255,255,.16);--bg:#140f2c;--pn:rgba(14,10,34,.22);--ts:rgba(0,0,0,.5);--sh:0 10px 34px rgba(0,0,0,.38)}

h1,h2,.m,#quiz.gate p{text-shadow:0 1px 12px var(--ts)}
h1{margin:0 0 6px;font-size:1.9rem}h2{margin:30px 0 12px;font-size:1.4rem}
button,input,a,.card,.meter i{transition:transform .35s var(--ease),background-color .4s,border-color .4s,box-shadow .4s,color .4s,opacity .4s,width .8s var(--ease)}
button{-webkit-tap-highlight-color:transparent}button:active{transform:scale(.96)!important}
.glass,.card,.btn,.tabs button,.tbtn,input,.tb button,#toast{-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

@keyframes spin{to{transform:rotate(360deg)}}

.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

<script>// «Бэкенд» в браузере: все данные хранятся в LS. Используется обеими страницами.
const LS=(()=>{try{const t="__t";localStorage.setItem(t,"1");localStorage.removeItem(t);return localStorage}catch(e){
  const g=()=>{try{return JSON.parse(window.name)||{}}catch{return {}}};
  return{getItem:k=>{const v=g()[k];return v===undefined?null:v},setItem:(k,v)=>{const o=g();o[k]=String(v);window.name=JSON.stringify(o)},removeItem:k=>{const o=g();delete o[k];window.name=JSON.stringify(o)}}}})();
const DB = {
  K: "astana_db", S: "astana_session",
  load() { try { return JSON.parse(LS.getItem(this.K)) || { users: {} }; } catch { return { users: {} }; } },
  store(d) { LS.setItem(this.K, JSON.stringify(d)); },
  pub(u) { return { login: u.login, created: u.created, avatar: u.avatar || null, friends: u.friends || [], favs: u.favs, visits: u.visits, moods: u.moods, last: u.moods[u.moods.length - 1] || null }; },
  mini(t) { return { login: t.login, avatar: t.avatar || null, last: t.moods[t.moods.length - 1] || null }; },
  cyrb(s) { let a = 0xdeadbeef, b = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
    a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
    return (4294967296 * (2097151 & b) + (a >>> 0)).toString(16); },
  async hash(pw, salt, alg) {
    const s = salt + pw, sub = globalThis.crypto && crypto.subtle;
    alg = alg || (sub ? "s:" : "c:");
    if (alg === "s:" && sub) { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return "s:" + [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join(""); }
    return "c:" + this.cyrb(s);
  },
  async call(p, b = {}) {
    const d = this.load();
    if (p === "register") {
      const { login, password } = b;
      if (typeof login !== "string" || !/^[\p{L}\p{N}_.-]{3,32}$/u.test(login)) throw new Error("Логин: 3–32 символа (буквы, цифры, _ . -)");
      if (typeof password !== "string" || password.length < 6 || password.length > 100) throw new Error("Пароль: от 6 символов");
      const k = login.toLowerCase();
      if (d.users[k]) throw new Error("Такой логин уже занят");
      const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      d.users[k] = { login, salt, hash: await this.hash(password, salt), created: new Date().toISOString(), favs: [], visits: [], moods: [] };
      this.store(d); LS.setItem(this.S, k); return this.pub(d.users[k]);
    }
    if (p === "login") {
      const u = d.users[String(b.login || "").toLowerCase()];
      if (!u || u.hash !== await this.hash(String(b.password || ""), u.salt, u.hash.slice(0, 2))) throw new Error("Неверный логин или пароль");
      LS.setItem(this.S, u.login.toLowerCase()); return this.pub(u);
    }
    if (p === "logout") { LS.removeItem(this.S); return { ok: true }; }
    const k = LS.getItem(this.S), u = k && d.users[k];
    if (!u) throw new Error("Требуется вход");
