<script>try{var t=localStorage.getItem("moodmix_theme");document.documentElement.dataset.theme=localStorage.getItem("moodmix_sad")==="1"?"sad":t==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"><style>/* MoodMix — «Восход» (light) и «Закат» (dark) */
:root{--pad:clamp(20px,5vw,112px);--t:#10233a;--m:#3d5470;--a:#c2410c;--ag:linear-gradient(135deg,#ff9a3c,#ff5d7a);--c:rgba(255,255,255,.28);--b:rgba(255,255,255,.55);--bg:#cfe6fb;--pn:rgba(255,255,255,.2);--ts:rgba(255,255,255,.55);--sh:0 10px 34px rgba(30,70,120,.16);--ease:cubic-bezier(.22,.8,.24,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--t:#f6f0fd;--m:#cdc1e3;--a:#ffb27a;--c:rgba(26,16,54,.3);--b:rgba(255,255,255,.16);--bg:#140f2c;--pn:rgba(14,10,34,.22);--ts:rgba(0,0,0,.5);--sh:0 10px 34px rgba(0,0,0,.38)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;transition:color .6s,background-color .6s}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;letter-spacing:-.01em}
h1,h2,.m,#quiz.gate p{text-shadow:0 1px 12px var(--ts)}
h1{margin:0 0 6px;font-size:1.9rem}h2{margin:30px 0 12px;font-size:1.4rem}
button,input,a,.card,.meter i{transition:transform .35s var(--ease),background-color .4s,border-color .4s,box-shadow .4s,color .4s,opacity .4s,width .8s var(--ease)}
button{-webkit-tap-highlight-color:transparent}button:active{transform:scale(.96)!important}
.glass,.card,.btn,.tabs button,.tbtn,input,.tb button,#toast{-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-480px)}to{transform:translateX(110vw)}}

input{width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t);font:inherit;margin:12px 0;outline:0}

.bar{max-width:none;margin:0;padding:0 var(--pad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}

.tabs button.on,.btn.c,.tb button.on{background:var(--ag);color:#fff;border-color:transparent;text-shadow:none;box-shadow:0 6px 20px rgba(255,93,122,.35)}
main{max-width:none;margin:0;padding:0 var(--pad) 32px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px 14px;position:relative;box-shadow:var(--sh)}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 44px rgba(20,20,60,.25);border-color:var(--a)}

#out.an .card,#out.an h2{animation:up .7s var(--ease) backwards;animation-delay:min(calc(var(--i,0)*55ms),800ms)}
.fav{position:absolute;top:10px;right:12px;border:0;background:none;font-size:1.45rem;cursor:pointer;color:var(--m)}
.fav:hover{transform:scale(1.25)}.fav.on{color:#ff3d78;text-shadow:0 0 14px rgba(255,61,120,.55)}
#quiz{max-width:968px;margin:8px auto 12px;padding:18px;background:var(--c);border:1px solid var(--b);border-radius:20px}#quiz h2{margin:4px 0 12px}.qn{margin:0;color:var(--a);font-size:.85rem;font-weight:700}
#quiz>*{animation:up .6s var(--ease) backwards}#quiz>*:nth-child(2){animation-delay:.06s}#quiz>*:nth-child(3){animation-delay:.12s}#quiz>*:nth-child(4){animation-delay:.18s}#quiz>*:nth-child(5){animation-delay:.24s}#quiz>*:nth-child(6){animation-delay:.3s}

.btn:hover{transform:translateX(5px) scale(1.01);border-color:var(--a);box-shadow:var(--sh)}.btn.c:hover{transform:translateY(-2px) scale(1.01)}
.meter{height:12px;background:var(--c);border:1px solid var(--b);border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ag);animation:grow 1.2s var(--ease) backwards}
@keyframes grow{from{width:0!important}}

.m{color:var(--m)}.er{color:#ff3d78;min-height:1.3em;margin:6px 0 0}
#auth{position:fixed;inset:0;overflow:auto;display:flex;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.ac{width:100%;max-width:440px;margin:auto;padding:26px;border-radius:24px;background:var(--pn);border:1px solid var(--b);box-shadow:var(--sh);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-sizing:border-box;animation:up .8s var(--ease) backwards}.ac h1{margin:0 0 8px}
.tb{display:flex;gap:8px;margin:18px 0 0}.tb button{flex:1;padding:11px;border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t);font:inherit;cursor:pointer}.tb button:hover{transform:translateY(-2px)}
.btn.c{text-align:center;color:#fff;background:var(--ag);border-color:transparent}
#app{padding:0;animation:fade .8s}
#app header{display:flex;justify-content:space-between;align-items:center;max-width:none;margin:10px var(--pad) 8px;padding:10px 18px;text-align:left;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;border-radius:22px;background:var(--pn);border:1px solid var(--b);box-shadow:var(--sh);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
#app header h1{font-size:1.45rem;margin:0}
#av,.av2{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--ag);color:#fff;font:700 1.1rem system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,93,122,.4)}
#av:hover{transform:scale(1.1) rotate(-6deg)}
#pf{position:fixed;inset:0;z-index:200;background:rgba(10,8,30,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
#pf:not([hidden]){animation:fade .35s}#pf:not([hidden]) .pc{animation:up .5s var(--ease)}
.pc{background:#f5f8fd;color:var(--t);border:1px solid var(--b);box-shadow:var(--sh);border-radius:24px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:22px;box-sizing:border-box}
:root:not([data-theme="dark"]) .pc{background:#f5f8fd}:root[data-theme="dark"] .pc{background:#1c1438}
.pc h3{margin:18px 0 6px}.pc ul{padding-left:18px;margin:0}.pc li{margin:4px 0}
.vb{display:inline-block;margin:6px 8px 0 0;padding:7px 12px;border:1px solid var(--a);border-radius:10px;background:none;color:var(--a);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.vb:hover{background:var(--ag);color:#fff;border-color:transparent;transform:translateY(-2px)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--t);color:var(--bg);padding:11px 18px;border-radius:22px;opacity:0;transition:.5s var(--ease);pointer-events:none;z-index:300}#toast.on{opacity:1;transform:translate(-50%,0)}
.hr{display:flex;gap:10px;align-items:center}
.tbtn{padding:9px 14px;border:1px solid var(--b);border-radius:22px;background:var(--c);color:var(--t);font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}.tbtn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.thf{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5}
#app footer{max-width:none;margin:0;padding:14px var(--pad);border-radius:0;border-width:1px 0 0;background:var(--pn);border:1px solid var(--b);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* небо */
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden}
#neb,#shoot,#cosmos{display:none}
:root[data-theme="sad"]{--t:#eaeeff;--m:#b3bce6;--a:#a9b8ff;--ag:linear-gradient(135deg,#5f6fe0,#9a62e0);--c:rgba(20,26,66,.38);--b:rgba(190,200,255,.18);--bg:#070a22;--pn:rgba(10,14,44,.3);--ts:rgba(0,0,10,.6);--sh:0 10px 34px rgba(0,0,20,.5)}
:root[data-theme="sad"] #sky{background:radial-gradient(ellipse at 50% 40%,#1b2052 0%,#0c1034 48%,#04061a 100%)}
:root[data-theme="sad"] :is(#sun,#moon,#clouds,#hill){display:none}
:root[data-theme="sad"] :is(#neb,#shoot,#cosmos){display:block}
:root[data-theme="sad"] #stars{height:100%}
:root[data-theme="sad"] .pc{background:#121842}

#neb{position:absolute;inset:-10%;background:linear-gradient(118deg,transparent 28%,rgba(150,140,255,.13) 44%,rgba(210,170,255,.2) 50%,rgba(120,160,255,.12) 57%,transparent 72%),radial-gradient(ellipse 14% 7% at 14% 20%,rgba(190,170,255,.4),transparent 70%),radial-gradient(ellipse at 20% 75%,rgba(120,70,200,.35),transparent 55%),radial-gradient(ellipse at 85% 22%,rgba(60,110,220,.3),transparent 55%),radial-gradient(ellipse at 60% 92%,rgba(190,80,170,.18),transparent 50%);animation:neb 40s ease-in-out infinite alternate}
@keyframes neb{to{transform:translate(-3%,2%) scale(1.06)}}

#cosmos{position:absolute;left:50%;top:40%;width:min(100vw,100vh,920px);aspect-ratio:1;transform:translate(-50%,calc(-50% + var(--py,0px)));will-change:transform;animation:cfade 1.4s ease both}

@keyframes cfade{from{opacity:0}}
#stars i.dp{display:none}:root[data-theme="sad"] #stars i.dp{display:block;background:#cfd8ff}#cosmos .far{animation:farf 9s ease-in-out infinite alternate}@keyframes farf{from{transform:translateY(0)}to{transform:translateY(-6px)}}
#cosmos .earth{transform:translate(80px,-10px)}@media(min-width:900px){#cosmos .earth{transform:translate(-300px,-60px)}}
#cosmos .bands{animation:band 18s ease-in-out infinite alternate}@keyframes band{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
#cosmos .rk{transform-box:fill-box;transform-origin:center;animation:rock 5s ease-in-out infinite}@keyframes rock{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-1px)}}
#cosmos .tear{animation:tear 3.2s ease-in infinite}@keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:.95}100%{opacity:0;transform:translateY(14px)}}

#sun,#moon{position:absolute;border-radius:50%;will-change:top,left}

.cp{fill:var(--cl)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

.card{display:flex;flex-direction:column}.card .act{margin-top:auto;padding-top:10px}.act small{display:block;margin-bottom:2px}

textarea:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(255,140,70,.22)}
.stp{display:flex;gap:4px;margin:6px 0}.stp button{border:0;background:none;font-size:2.1rem;line-height:1;cursor:pointer;color:var(--m);opacity:.5;padding:2px}

/* ===== правки по аудиту: переполнение, подписи, фокус, демо-плашки ===== */
html{overflow-x:hidden}body{overflow-x:clip;max-width:100%}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.lbl{display:block;margin:14px 0 -4px;font-size:.88rem;font-weight:700;color:var(--t);text-align:left}

footer a{color:var(--a);font-weight:600}
/* ===== профиль: крупное окно, блокировка прокрутки страницы под ним ===== */

<script>// «Бэкенд» в браузере: все данные хранятся в LS. Используется обеими страницами.

  cyrb(s) { let a = 0xdeadbeef, b = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }

  // Пароли: PBKDF2-SHA256 (600 000 итераций) — "p:". Старые хеши ("s:", "c:") принимаются и переписываются при входе.
  async hash(pw, salt, alg) {

  async call(p, b = {}) {

      const { login, password } = b;
      if (typeof login !== "string" || !/^[\p{L}\p{N}_.-]{3,32}$/u.test(login)) throw new Error("Логин: 3–32 символа (буквы, цифры, _ . -)");

    if (p === "reviews") { if (!ok(b.key, 150)) throw new Error("Некорректные данные"); return (d.reviews || []).filter(r => r.key === b.key).sort((a, c) => c.at.localeCompare(a.at)).map(r => ({ ...r, avatar: (d.users[r.user] || {}).avatar || null })); }

      d.reviews = (d.reviews || []).filter(r => !(r.key === b.key && r.user === k));

    }
    if (p === "review_del") { if (!ok(b.key, 150)) throw new Error("Некорректные данные"); d.reviews = (d.reviews || []).filter(r => !(r.key === b.key && r.user === k)); this.store(d); return { ok: true }; }

    }

      else if (p === "friend_del") { u.friends = u.friends.filter(x => x !== t); tu.friends = tu.friends.filter(x => x !== k); }

  },
};</script>

// квадратная обрезка по центру до 256×256, JPEG — чтобы не раздувать хранилище
function resizeImg(f){return new Promise(async(res,rej)=>{if(f.type&&!/^image\//.test(f.type))return rej(new Error("Выберите файл-изображение"));if(f.size>15e6)return rej(new Error("Файл слишком большой (до 15 МБ)"));
const bad=()=>rej(new Error("Не удалось прочитать изображение. Попробуйте JPG или PNG"));
const draw=(src,w,h)=>{try{const S=256,s=Math.min(w,h),c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,S,S);x.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,S,S);res(c.toDataURL("image/jpeg",.85))}catch(e){bad()}};
if(window.createImageBitmap){try{const b=await createImageBitmap(f);return draw(b,b.width,b.height)}catch(e){}}
const fr=new FileReader();fr.onerror=bad;fr.onload=()=>{const im=new Image();im.onload=()=>draw(im,im.naturalWidth,im.naturalHeight);im.onerror=bad;im.src=fr.result};fr.readAsDataURL(f)})}
